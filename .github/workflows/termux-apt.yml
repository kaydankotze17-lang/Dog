name: Build Termux APT Repository & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-termux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Cargo version
        id: meta
        run: |
          CARGO_VER=$(grep '^version =' Cargo.toml | head -n1 | cut -d'"' -f2)
          DEB_VER="${CARGO_VER}-${{ github.run_number }}"
          echo "cargo_version=${CARGO_VER}" >> "$GITHUB_OUTPUT"
          echo "version=${DEB_VER}" >> "$GITHUB_OUTPUT"

      - name: Install Rust & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install dpkg-dev and apt-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

      - name: Run host unit & integration tests
        run: cargo test

      - name: Cross-compile for Termux (aarch64, armv7, x86_64) & package .deb
        run: |
          set -euo pipefail
          NDK_BIN="${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          chmod +x packaging/termux/build-deb.sh
          mkdir -p apt-repo/pool/main/d/dog apt-repo/latest

          # 1. aarch64 (64-bit ARM Android)
          CC_aarch64_linux_android="${NDK_BIN}/aarch64-linux-android24-clang" \
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${NDK_BIN}/aarch64-linux-android24-clang" \
          cargo build --release --target aarch64-linux-android
          "${NDK_BIN}/llvm-strip" target/aarch64-linux-android/release/dog
          ./packaging/termux/build-deb.sh aarch64 "${{ steps.meta.outputs.version }}" \
            target/aarch64-linux-android/release/dog \
            "apt-repo/pool/main/d/dog/dog_${{ steps.meta.outputs.version }}_aarch64.deb"
          cp "apt-repo/pool/main/d/dog/dog_${{ steps.meta.outputs.version }}_aarch64.deb" \
            "apt-repo/latest/dog_latest_aarch64.deb"

          # 2. arm (32-bit ARMv7 Android)
          CC_armv7_linux_androideabi="${NDK_BIN}/armv7a-linux-androideabi24-clang" \
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="${NDK_BIN}/armv7a-linux-androideabi24-clang" \
          cargo build --release --target armv7-linux-androideabi
          "${NDK_BIN}/llvm-strip" target/armv7-linux-androideabi/release/dog
          ./packaging/termux/build-deb.sh arm "${{ steps.meta.outputs.version }}" \
            target/armv7-linux-androideabi/release/dog \
            "apt-repo/pool/main/d/dog/dog_${{ steps.meta.outputs.version }}_arm.deb"
          cp "apt-repo/pool/main/d/dog/dog_${{ steps.meta.outputs.version }}_arm.deb" \
            "apt-repo/latest/dog_latest_arm.deb"

          # 3. x86_64 (Android emulators / Chromebooks)
          CC_x86_64_linux_android="${NDK_BIN}/x86_64-linux-android24-clang" \
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="${NDK_BIN}/x86_64-linux-android24-clang" \
          cargo build --release --target x86_64-linux-android
          "${NDK_BIN}/llvm-strip" target/x86_64-linux-android/release/dog
          ./packaging/termux/build-deb.sh x86_64 "${{ steps.meta.outputs.version }}" \
            target/x86_64-linux-android/release/dog \
            "apt-repo/pool/main/d/dog/dog_${{ steps.meta.outputs.version }}_x86_64.deb"
          cp "apt-repo/pool/main/d/dog/dog_${{ steps.meta.outputs.version }}_x86_64.deb" \
            "apt-repo/latest/dog_latest_x86_64.deb"

      - name: Generate Termux APT Repository Index & Updater Metadata
        run: |
          set -euo pipefail
          cp packaging/termux/setup-apt.sh apt-repo/update.sh
          chmod +x apt-repo/update.sh

          cat > apt-repo/version.json <<EOF
          {
            "version": "${{ steps.meta.outputs.cargo_version }}",
            "deb_version": "${{ steps.meta.outputs.version }}",
            "sha": "${{ github.sha }}"
          }
          EOF

          cd apt-repo
          for arch in aarch64 arm x86_64; do
            mkdir -p "dists/termux/main/binary-${arch}"
            dpkg-scanpackages --multiversion --arch "${arch}" pool/ > "dists/termux/main/binary-${arch}/Packages"
            gzip -9c "dists/termux/main/binary-${arch}/Packages" > "dists/termux/main/binary-${arch}/Packages.gz"
          done

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="DOG Language" \
            -o APT::FTPArchive::Release::Label="DOG Termux APT" \
            -o APT::FTPArchive::Release::Suite="termux" \
            -o APT::FTPArchive::Release::Codename="termux" \
            -o APT::FTPArchive::Release::Architectures="aarch64 arm x86_64" \
            -o APT::FTPArchive::Release::Components="main" \
            release dists/termux > dists/termux/Release

          cat > index.html <<EOF
          <!doctype html>
          <html><body>
          <h1>DOG Language Termux APT Repository (v${{ steps.meta.outputs.cargo_version }})</h1>
          <p>Install or force-upgrade cleanly without upstream mirror errors:</p>
          <pre>curl -sSL https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/update.sh | bash</pre>
          <p>Or once installed, run:</p>
          <pre>dog update</pre>
          </body></html>
          EOF

      - name: Publish APT Repo to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apt-repo

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apt-repo/pool/main/d/dog/*.deb
